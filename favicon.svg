<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Apple Space Black & Titanium Radial Depth -->
    <radialGradient id="appleBase" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="60%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#08080A"/>
    </radialGradient>

    <!-- Titanium Gold Sheen -->
    <linearGradient id="goldTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="25%" stop-color="#E5A93C"/>
      <stop offset="70%" stop-color="#C58522"/>
      <stop offset="100%" stop-color="#FCE1A0"/>
    </linearGradient>

    <!-- Glass Specular Hairline -->
    <linearGradient id="hairlineSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Lens Glare Highlight -->
    <linearGradient id="lensGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep Apple App Icon Drop Shadow -->
    <filter id="iconDepth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Laser Emboss Filter for Symbol -->
    <filter id="laserEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Apple Continuous Curve Squircle (Superellipse) -->
  <rect x="5" y="5" width="110" height="110" rx="27" ry="27" fill="url(#appleBase)" filter="url(#iconDepth)"/>

  <!-- Subdued Precision Hairline Rim -->
  <rect x="5.5" y="5.5" width="109" height="109" rx="26.5" ry="26.5" fill="none" stroke="url(#hairlineSpecular)" stroke-width="1"/>

  <!-- Subtle Top Convex Glare -->
  <path d="M 6 32 C 6 17.64 17.64 6 32 6 L 88 6 C 102.36 6 114 17.64 114 32 C 114 44 80 56 60 56 C 40 56 6 44 6 32 Z" fill="url(#lensGlare)"/>

  <!-- Central Emblem: Titanium Gold Calligraphic "क" & Poetry Quill -->
  <g filter="url(#laserEmboss)" fill="url(#goldTitanium)">
    <!-- Shirorekha (Top Horizontal Bar) -->
    <rect x="33" y="36" width="54" height="4.5" rx="2.25"/>

    <!-- Central Vertical Pillar -->
    <rect x="58" y="36" width="5" height="50" rx="2.5"/>

    <!-- Left Loop of 'क' with Calligraphic Weight -->
    <path d="M 58 49 C 43 49 37 57 37 64.5 C 37 72 43 78 58 78 Z" 
          fill="none" stroke="url(#goldTitanium)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Descending Flourish of 'क' -->
    <path d="M 60 58 C 72 56 81 60 81 68 C 81 74.5 75 79.5 69 81.5" 
          fill="none" stroke="url(#goldTitanium)" stroke-width="5" stroke-linecap="round"/>

    <!-- Celestial Quill Nib Star Accent -->
    <path d="M 83 31 L 84 35 L 88 36 L 84 37 L 83 41 L 82 37 L 78 36 L 82 35 Z" fill="#FFF2D6"/>
  </g>
</svg>
